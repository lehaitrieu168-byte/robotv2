<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VieNeu-TTS · Text-to-Speech tiếng Việt (self-host)</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>" />
</head>
<body>
  <div class="app">
    <header class="hero">
      <h1>🎙️ VieNeu-TTS</h1>
      <p class="sub">Text-to-Speech tiếng Việt · Nhân bản giọng · Chạy self-host trên máy bạn</p>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="preset">Giọng dựng sẵn</button>
      <button class="tab" data-tab="clone">Nhân bản giọng</button>
    </nav>

    <!-- TAB: Giọng dựng sẵn -->
    <section class="panel active" id="panel-preset">
      <label class="field">
        <span>Văn bản</span>
        <textarea id="preset-text" rows="5" maxlength="1000"
          placeholder="Nhập văn bản tiếng Việt cần đọc...">Xin chào, đây là VieNeu-TTS chạy trên máy chủ của bạn.</textarea>
        <small class="counter"><span id="preset-count">0</span>/1000</small>
      </label>

      <div class="row">
        <label class="field">
          <span>Giọng</span>
          <select id="preset-voice"><option>Đang tải giọng…</option></select>
        </label>
        <label class="field">
          <span>Phong cách</span>
          <select id="preset-style">
            <option value="">Mặc định</option>
            <option value="tu_nhien">Tự nhiên</option>
            <option value="tin_tuc">Bản tin</option>
            <option value="doc_truyen">Đọc truyện</option>
          </select>
        </label>
      </div>

      <div class="cues">
        <span class="cues-label">Chèn biểu cảm:</span>
        <button type="button" class="cue" data-cue="[cười]">😄 cười</button>
        <button type="button" class="cue" data-cue="[thở dài]">😮‍💨 thở dài</button>
        <button type="button" class="cue" data-cue="[hắng giọng]">🗣️ hắng giọng</button>
      </div>

      <button class="generate" id="preset-go">🔊 Tạo giọng nói</button>
    </section>

    <!-- TAB: Nhân bản giọng -->
    <section class="panel" id="panel-clone">
      <label class="field">
        <span>Văn bản</span>
        <textarea id="clone-text" rows="5" maxlength="1000"
          placeholder="Văn bản sẽ được đọc bằng giọng bạn tải lên...">Đây là giọng nói được nhân bản từ audio mẫu.</textarea>
      </label>

      <label class="field">
        <span>Audio mẫu (3–8 giây, WAV/MP3)</span>
        <input type="file" id="clone-ref" accept="audio/*" />
      </label>

      <label class="check">
        <input type="checkbox" id="clone-denoise" checked />
        <span>Tự động khử tạp âm nền (denoise)</span>
      </label>

      <button class="generate" id="clone-go">🧬 Nhân bản &amp; đọc</button>
    </section>

    <!-- Kết quả -->
    <section class="result" id="result" hidden>
      <div class="result-head">
        <span>Kết quả</span>
        <a class="download" id="download" download="vieneu-tts.wav">⬇️ Tải WAV</a>
      </div>
      <audio id="player" controls></audio>
    </section>

    <div class="status" id="status" hidden></div>

    <footer class="foot">
      Dựng trên <a href="https://github.com/pnnbao97/VieNeu-TTS" target="_blank" rel="noopener">VieNeu-TTS</a>
      · Giao diện self-host · 48kHz
    </footer>
  </div>

  <script src="/app.js"></script>
</body>
</html>
